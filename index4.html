    <div class="form-group">
      <label class="form-label" for="su-gen-phone">Phone (optional)</label>
      <input class="form-input" type="tel" id="su-gen-phone" placeholder="+91-XXXXX-XXXXX" />

  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="su-gen-pw">Password *</label>
      <input class="form-input" type="password" id="su-gen-pw" placeholder="Min 6 chars" />
    </div>
    <div class="form-group">
      <label class="form-label" for="su-gen-pw2">Confirm Password *</label>
      <input class="form-input" type="password" id="su-gen-pw2" placeholder="Repeat" />
    </div>
  </div>
  <div class="form-error hidden" id="signup-gen-error"></div>
  <button class="btn btn-primary btn-full mt-16"
          onclick="AppPatch.handleGeneralSignup()">

</div>

<!-- ==============================================================
  [G] MODAL — Report Incident
  ADD BEFORE the closing </body> tag:
=============================================================== -->
<div class="modal-overlay hidden" id="modal-report-incident"
     onclick="App.handleModalOverlayClick(event,'modal-report-incident')">
  <div class="modal modal-lg" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h3 class="modal-title">🚨 Report an Incident</h3>
      <button class="modal-close" onclick="App.closeModal('modal-report-incident')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label" for="ri-type">Incident Type *</label>
        <select class="form-select" id="ri-type">
          <option value="">Select type…</option>
          <option>Flood / Water Logging</option>
          <option>Mass Casualty — Road Accident</option>
          <option>Fire / Building Collapse</option>
          <option>Medical Emergency — Outbreak</option>
          <option>Community Health Concern</option>
          <option>Earthquake Damage</option>
          <option>Missing Person / Child</option>
          <option>Hunger / Food Crisis</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="ri-location">Location *</label>
        <input class="form-input" type="text" id="ri-location"
               placeholder="e.g. Hadapsar, Pune or NH-48 near Khopoli" />
      </div>
      <div class="form-group">
        <label class="form-label" for="ri-desc">Description *</label>
        <textarea class="form-textarea" id="ri-desc" rows="3"
                  placeholder="Describe what you see — number of people affected, immediate needs, road access…"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="ri-fatalities">Fatalities (if known)</label>
          <input class="form-input" type="number" id="ri-fatalities" min="0" placeholder="0" />
        </div>
        <div class="form-group">
          <label class="form-label" for="ri-injuries">Injuries (if known)</label>
          <input class="form-input" type="number" id="ri-injuries" min="0" placeholder="0" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Criticality</label>
        <div class="crit-picker">
          <label class="crit-option crit-high">
            <input type="radio" name="ri-crit" id="ri-crit-high" value="High" />
            <span>🔴 High — Immediate life risk</span>
          </label>
          <label class="crit-option crit-low">
            <input type="radio" name="ri-crit" id="ri-crit-low" value="Low" checked />
            <span>🟡 Low — Needs attention</span>
          </label>
        </div>
      </div>
      <div class="form-error hidden" id="ri-error"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="App.closeModal('modal-report-incident')">Cancel</button>
        <button class="btn btn-danger" onclick="AppPatch.submitIncidentReport()">
          🚨 Submit Report
        </button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="modal-squad-chat">
  <div class="modal modal-lg" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-squad-chat-title">⚔️ Squad Chat</h3>
      <button class="modal-close" onclick="App.closeModal('modal-squad-chat');AppPatch._activeSquadChatId=null">✕</button>
    </div>
    <div class="modal-body" style="padding-bottom:0">
      <div class="chat-thread" id="squad-chat-thread"
           style="min-height:260px;max-height:360px;overflow-y:auto;padding:4px 0;margin-bottom:14px"></div>
      <div style="display:flex;gap:8px;padding:14px 0;border-top:1px solid var(--border)">
        <input class="form-input" type="text" id="squad-chat-input"
               placeholder="Message your squad…"
               onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();AppPatch.sendSquadChatMessage()}"
               style="flex:1" />
        <button class="btn btn-primary" onclick="AppPatch.sendSquadChatMessage()">Send →</button>
      </div>
    </div>
  </div>
</div>
